# Optional inventory of required Hermes GitHub skills
# Place at /etc/controlled-system-update/hermes-skills.conf
#
# The update script reads this file and reports any listed skill that is not
# provenance-tracked by Hermes. It does NOT install missing skills — it only
# warns so you can review and install them manually.
#
# Each entry should match the identifier used with `hermes skills install`.
# For GitHub skills, use the owner/repository/skills/skill-name format.

HERMES_REQUIRED_GITHUB_SKILLS=(
    "Green-Needle-Tech/controlled-system-update"
)
