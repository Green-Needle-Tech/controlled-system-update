# controlled-system-update configuration file
# Copy to /etc/controlled-system-update/auto-update.conf and edit
# Or place alongside the script and set CSU_CONFIG env var

# ─── Telegram Notification ───────────────────────────────────────────────────
# Get these from @BotFather (token) and @userinfobot (chat ID)
TG_BOT_TOKEN=""
TG_CHAT_ID=""

# Label for this host in notifications (default: hostname -s)
# HOSTNAME_LABEL="my-server"

# ─── Notification Policy ─────────────────────────────────────────────────────
# error   — notify only when the run has errors (quietest)
# warning — notify on errors and warnings (default)
# always  — send a summary on every run, including clean ones
NOTIFY_LEVEL="warning"

# Immediate critical alerts: send a Telegram message the moment a high/critical
# error occurs during the run (e.g. apt failure, gateway down, disk critical),
# instead of waiting for the end-of-run summary. Set to "false" to only get
# the summary.
NOTIFY_IMMEDIATE="true"

# ─── Update Toggles ──────────────────────────────────────────────────────────
# Set any to "true" to enable that update phase
UPDATE_DOCKER="true"
UPDATE_HERMES="true"
UPDATE_SNAP="true"

# npm and Python/uv tool updates are opt-in (not OS maintenance)
UPDATE_NPM="false"
UPDATE_PYTHON="false"

# ─── Upgrade Behaviour (apt) ─────────────────────────────────────────────────
# Ubuntu phases some updates to a fraction of machines. Setting this to true
# pulls phased updates immediately, which keeps a fleet uniform at the cost of
# being an earlier adopter. Default: false (respect phasing).
INCLUDE_PHASED_UPDATES="false"

# ─── Package Holds ───────────────────────────────────────────────────────────
# Space-separated list of packages to hold (never auto-upgrade)
# PKG_HOLDS="docker.io libc6"

# ─── Reboot ──────────────────────────────────────────────────────────────────
# A compulsory reboot is scheduled after every update run, regardless of
# whether /var/run/reboot-required is present. A Telegram notification is
# sent before rebooting so you know it's coming.
REBOOT_DELAY="5"

# ─── Upgrade Scope ───────────────────────────────────────────────────────────
# dist-upgrade can remove packages to resolve dependencies (riskier)
# Default: false (upgrade only); set true for maintenance windows
DIST_UPGRADE="false"

# autoremove removes packages that are no longer needed
# Default: false (opt-in for safety)
AUTO_REMOVE="false"

# ─── Log Rotation ────────────────────────────────────────────────────────────
# Delete log files older than N days (0 = disable cleanup)
LOG_RETENTION_DAYS="30"

# ─── Hermes Agent ────────────────────────────────────────────────────────────
# Hermes is updated using the supported `hermes update --yes` workflow
# Bundled skills are synchronized during the Hermes core update
#
# Paths are AUTO-DETECTED at runtime — no configuration needed on most hosts:
#   - CLI: `hermes` on PATH, then common install locations
#   - User home: owner of the running gateway process (works for root or
#     regular-user installs such as /home/ubuntu), then owner of the CLI
#   - HERMES_HOME defaults to <user home>/.hermes
#   - User: owner of the user home; when this script runs as root and the
#     owner is a regular user (e.g. ubuntu), all hermes commands run as
#     that user via runuser — this avoids git's "dubious ownership"
#     error when the hermes-agent repo is owned by a non-root user
#
# Uncomment ONLY for non-standard layouts where detection fails:
# HERMES_HOME="/root/.hermes"
# HERMES_USER_HOME="/root"
# HERMES_USER="root"
# HERMES_CLI="/usr/local/bin/hermes"
HERMES_UPDATE_TIMEOUT="1800"

# Timeout for `hermes gateway restart`. NOT the skills timeout: the gateway
# drains in-flight agent turns before stopping, so this needs its own budget.
HERMES_GATEWAY_RESTART_TIMEOUT="600"

# ─── Hermes External Skills ──────────────────────────────────────────────────
# External (non-bundled) skills have a separate lifecycle from bundled skills.
# This includes unofficial GitHub repos, custom taps, direct URLs, skills.sh,
# well-known endpoints, and community registries — anything installed via
# `hermes skills install` and tracked in ${HERMES_HOME}/skills/.hub/lock.json.
#
# off:    do not check or update external skills
# check:  report available updates only (default)
# update: update all provenance-tracked external skills
HERMES_SKILLS_MODE="check"

# Re-run security checks after checking or updating
HERMES_SKILLS_AUDIT="true"

# Include all Hermes-managed sources (GitHub, URL, tap, hub, community).
# Hermes performs source selection from its lock file; this documents policy.
HERMES_SKILLS_SCOPE="all"

HERMES_SKILLS_TIMEOUT="600"

# ─── Full Diagnostic ─────────────────────────────────────────────────────────
# After all update phases + basic health checks, run a comprehensive
# diagnostic (dpkg audit, broken deps, journal errors, Docker health,
# network/DNS, dmesg, Hermes doctor). Findings are reported in the log
# and notification; no automated remediation is attempted.
#
# Set DIAGNOSTIC_ENABLED to false to skip the full diagnostic entirely.
DIAGNOSTIC_ENABLED="true"

# ─── Logging ─────────────────────────────────────────────────────────────────
LOG_DIR="/var/log/controlled-system-update"
LOCK_FILE="/var/lock/controlled-system-update.lock"
