# controlled-system-update configuration file
# Copy to /etc/controlled-system-update/auto-update.conf and edit
# Or place alongside the script and set CSU_CONFIG env var

# ─── Telegram Notification ───────────────────────────────────────────────────
# Get these from @BotFather (token) and @userinfobot (chat ID)
TG_BOT_TOKEN=""
TG_CHAT_ID=""

# Label for this host in notifications (default: hostname -s)
# HOSTNAME_LABEL="my-server"

# ─── Update Toggles ──────────────────────────────────────────────────────────
# Set any to "true" to enable that update phase
UPDATE_DOCKER="true"
UPDATE_HERMES="true"
UPDATE_SNAP="true"

# npm and Python/uv tool updates are opt-in (not OS maintenance)
UPDATE_NPM="false"
UPDATE_PYTHON="false"

# ─── Package Holds ───────────────────────────────────────────────────────────
# Space-separated list of packages to hold (never auto-upgrade)
# PKG_HOLDS="docker.io libc6"

# ─── Reboot ──────────────────────────────────────────────────────────────────
# If true, automatically reboot when /var/run/reboot-required is present
# A Telegram notification is sent before rebooting so you know it's coming
# Default: false (opt-in for safety — reboot is deferred to end of run)
AUTO_REBOOT="false"

# Delay (in minutes) before auto-reboot — gives time to cancel if needed
# Use `shutdown -c` to cancel a scheduled reboot
REBOOT_DELAY="5"

# ─── Upgrade Scope ───────────────────────────────────────────────────────────
# dist-upgrade can remove packages to resolve dependencies (riskier)
# Default: false (upgrade only); set true for maintenance windows
DIST_UPGRADE="false"

# autoremove removes packages that are no longer needed
# Default: false (opt-in for safety)
AUTO_REMOVE="false"

# ─── Log Rotation ────────────────────────────────────────────────────────────
# Delete log files older than N days (0 = disable cleanup)
LOG_RETENTION_DAYS="30"

# ─── Hermes Agent ────────────────────────────────────────────────────────────
# Hermes is updated using the supported `hermes update --yes` workflow
# Bundled skills are synchronized during the Hermes core update
HERMES_HOME="/root/.hermes"
HERMES_USER_HOME="/root"
HERMES_CLI="/usr/local/bin/hermes"
HERMES_UPDATE_TIMEOUT="1800"

# ─── Hermes External Skills ──────────────────────────────────────────────────
# External (non-bundled) skills have a separate lifecycle from bundled skills.
# This includes unofficial GitHub repos, custom taps, direct URLs, skills.sh,
# well-known endpoints, and community registries — anything installed via
# `hermes skills install` and tracked in ${HERMES_HOME}/skills/.hub/lock.json.
#
# off:    do not check or update external skills
# check:  report available updates only (default)
# update: update all provenance-tracked external skills
HERMES_SKILLS_MODE="check"

# Re-run security checks after checking or updating
HERMES_SKILLS_AUDIT="true"

# Include all Hermes-managed sources (GitHub, URL, tap, hub, community).
# Hermes performs source selection from its lock file; this documents policy.
HERMES_SKILLS_SCOPE="all"

HERMES_SKILLS_TIMEOUT="600"

# ─── Logging ─────────────────────────────────────────────────────────────────
LOG_DIR="/var/log/controlled-system-update"
LOCK_FILE="/var/lock/controlled-system-update.lock"
